<div class="mb-4 flex items-center justify-between">
  <h1 class="m-0 text-3xl font-semibold text-surface-900 dark:text-surface-0">{{ 'storages.title' | translate }}</h1>
  <p-button [label]="'common.new' | translate" icon="pi pi-plus" (onClick)="openCreate()"/>
</div>

@if (loading() && nodes().length === 0) {
  <app-table-skeleton [headers]="[('common.name' | translate), ('common.description' | translate)]"/>
} @else {
  <p-treetable [value]="nodes()" [loading]="loading()" [tableStyle]="{ 'min-width': '40rem' }">
    <ng-template #header>
      <tr>
        <th>{{ 'common.name' | translate }}</th>
        <th>{{ 'common.description' | translate }}</th>
        <th style="width: 10rem"></th>
      </tr>
    </ng-template>
    <ng-template #body let-rowNode let-rowData="rowData">
      <tr [ttRow]="rowNode">
        <td>
          <p-treetabletoggler [rowNode]="rowNode"/>
          {{ rowData.name }}
        </td>
        <td>{{ rowData.description }}</td>
        <td>
          <div class="flex justify-end gap-1">
            <p-button
              icon="pi pi-plus"
              [rounded]="true"
              [text]="true"
              [title]="'tree.createChild' | translate"
              (onClick)="openCreate(rowData)"
            />
            <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" (onClick)="openEdit(rowData)"/>
            <p-button
              icon="pi pi-trash"
              severity="danger"
              [rounded]="true"
              [text]="true"
              (onClick)="remove(rowData)"
            />
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="3">{{ 'tree.empty' | translate }}</td>
      </tr>
    </ng-template>
  </p-treetable>
}

<p-dialog
  [header]="(editing() ? 'tree.editTitle' : 'tree.createTitle') | translate"
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  [modal]="true"
  [style]="{ width: '30rem' }"
>
  <form class="flex flex-col gap-4" [formGroup]="form" (ngSubmit)="save()">
    <div class="flex flex-col gap-1.5">
      <label for="name">{{ 'common.nameRequired' | translate }}</label>
      <input pInputText id="name" formControlName="name" maxlength="255"/>
    </div>
    <div class="flex flex-col gap-1.5">
      <label for="description">{{ 'common.description' | translate }}</label>
      <textarea pTextarea id="description" formControlName="description" rows="3" maxlength="1000"></textarea>
    </div>
    <div class="flex flex-col gap-1.5">
      <label for="parent">{{ 'tree.parent' | translate }}</label>
      <p-select
        inputId="parent"
        formControlName="parentId"
        [options]="parentOptions()"
        optionLabel="label"
        optionValue="id"
        [showClear]="true"
        [filter]="true"
        [placeholder]="'tree.parentPlaceholder' | translate"
        appendTo="body"
      />
    </div>
  </form>
  <ng-template #footer>
    <p-button [label]="'common.cancel' | translate" severity="secondary" [text]="true"
              (onClick)="dialogVisible.set(false)"/>
    <p-button [label]="'common.save' | translate" icon="pi pi-check" (onClick)="save()"/>
  </ng-template>
</p-dialog>
