name: CI

on:
  pull_request:
  push:
    branches:
      - stage

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # environment.ts ist gitignored und wird für Tests/Build aus der Vorlage erzeugt
      - name: Create environment file
        run: cp src/environments/example.environment.ts src/environments/environment.ts

      - name: Run tests
        run: npx ng test --watch=false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Create environment file
        run: cp src/environments/example.environment.ts src/environments/environment.ts

      - name: Build
        run: npx ng build
