<div class="flex min-h-screen">
  <aside
    class="sticky top-0 flex h-screen w-72 shrink-0 flex-col gap-4 border-r border-surface bg-surface-0 p-4 dark:bg-surface-900"
  >
    <div class="flex items-center gap-3 p-2 text-xl font-semibold text-primary">
      <i class="pi pi-box"></i>
      <span>InventarBuddy</span>
      <app-language-switcher class="ml-auto"/>
    </div>

    <p-menu [model]="menuItems()" styleClass="w-full border-none"/>

    <div class="mt-auto flex flex-col gap-3 border-t border-surface pt-4">
      <a
        class="flex cursor-pointer items-center gap-3 rounded-border p-2 text-inherit no-underline hover:bg-emphasis"
        routerLink="/profile"
        routerLinkActive="bg-emphasis"
        [title]="'nav.editProfile' | translate"
      >
        <i class="pi pi-user"></i>
        <div>
          <div class="font-semibold">{{ auth.username }}</div>
          @if (auth.email) {
            <div class="text-sm text-muted-color">{{ auth.email }}</div>
          }
        </div>
        <i class="pi pi-chevron-right ml-auto text-xs text-muted-color"></i>
      </a>
      <p-button
        [label]="'nav.logout' | translate"
        icon="pi pi-sign-out"
        severity="secondary"
        [outlined]="true"
        size="small"
        (onClick)="logout()"
      />
    </div>
  </aside>

  <main class="min-w-0 flex-1 p-6">
    <router-outlet/>
  </main>
</div>
