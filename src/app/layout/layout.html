<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <i class="pi pi-box"></i>
      <span>InventarBuddy</span>
      <app-language-switcher class="language" />
    </div>

    <p-menu [model]="menuItems()" styleClass="sidebar-menu" />

    <div class="user">
      <a
        class="user-info"
        routerLink="/profile"
        routerLinkActive="active"
        [title]="'nav.editProfile' | translate"
      >
        <i class="pi pi-user"></i>
        <div>
          <div class="user-name">{{ auth.username }}</div>
          @if (auth.email) {
            <div class="user-email">{{ auth.email }}</div>
          }
        </div>
        <i class="pi pi-chevron-right user-chevron"></i>
      </a>
      <p-button
        [label]="'nav.logout' | translate"
        icon="pi pi-sign-out"
        severity="secondary"
        [outlined]="true"
        size="small"
        (onClick)="logout()"
      />
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
